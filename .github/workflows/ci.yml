name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check . --select E9,F63,F7,F82

      # The database is a build artefact of data_ingestion.py and is gitignored,
      # so the data-quality tests skip here and the analytics unit tests (which
      # run on synthetic data) carry CI.
      - name: Run tests
        run: pytest tests/ -v

      - name: Verify dashboard imports and renders
        run: |
          python -c "import analytics; print('analytics OK')"
          python - <<'PY'
          import ast, pathlib
          # Parse-check the app without needing a database or a browser.
          src = pathlib.Path("app.py").read_text()
          ast.parse(src)
          assert "use_container_width" not in src, "deprecated Streamlit API present"
          print("app.py OK")
          PY
